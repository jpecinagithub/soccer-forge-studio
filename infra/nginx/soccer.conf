# Soccer Forge Studio — fragmento nginx (PROPUESTA, no instalado)
# Integrar como bloques location en /etc/nginx/sites-enabled/mi-gps
# (mismo patrón que /appforge/). Ver docs/DEPLOYMENT.md §7.
# Después de editar: sudo nginx -t && sudo systemctl reload nginx

location /soccer/ {
    proxy_pass http://127.0.0.1:4310/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2G;
}

location /soccer/api/ {
    proxy_pass http://127.0.0.1:4300/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2G;
    proxy_read_timeout 300s;
}
